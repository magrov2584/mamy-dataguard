name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: MamyDataGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
